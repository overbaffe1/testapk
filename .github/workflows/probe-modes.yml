name: probe-modes

on:
  workflow_dispatch:
  push:
    branches: ["arena/f2fe24f5-testapk"]
    paths: [".github/workflows/probe-modes.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: tunnel/src/go.mod
      - name: Build tunnel
        working-directory: tunnel/src
        run: |
          go mod tidy
          go build -trimpath -o ../wdtt-probe .
      - name: Probe WG and RAW through SOCKS5
        shell: bash
        run: |
          set -uo pipefail
          BIN="$GITHUB_WORKSPACE/tunnel/wdtt-probe"
          HOST='srv4.dream31.ru'
          PASS='k7FaeaaR2UbyvJde'
          HASH='FDzujtg_2dEw1KJK5UFLAsHNxtID32lHa2Md4lSLJqw'
          FAILED=0

          probe() {
            local label="$1" mode="$2" peer_port="$3" socks_port="$4" listen_port="$5"
            local log="/tmp/${label}.log"
            echo "Starting $label ($mode, peer $peer_port)"
            "$BIN" \
              -peer "$HOST:$peer_port" \
              -vk "$HASH" -n 9 \
              -listen "127.0.0.1:$listen_port" \
              -device-id 'chrome-innpafjo' \
              -password "$PASS" \
              -captcha-mode auto -vk-auth anonymous -go-dns yandex -obfs audio \
              -mode "$mode" -socks "127.0.0.1:$socks_port" >"$log" 2>&1 &
            local pid=$!
            local ready=0
            for _ in $(seq 1 180); do
              if grep -q '\[SOCKS\] listening' "$log"; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done

            if [[ "$ready" == 1 ]]; then
              local ip
              ip="$(curl -kfsS --max-time 45 --socks5-hostname "127.0.0.1:$socks_port" https://api.ipify.org || true)"
              if [[ "$ip" =~ ^[0-9a-fA-F:.]+$ ]]; then
                echo "::notice title=${label}_PROBE_OK::SOCKS ready; egress IP ${ip}"
              else
                echo "::error title=${label}_PROBE_FAILED::SOCKS ready, but IP check failed"
                FAILED=1
              fi
            else
              echo "::error title=${label}_PROBE_FAILED::SOCKS did not become ready"
              FAILED=1
            fi
            echo "===== $label log tail ====="
            tail -n 120 "$log" || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            sleep 2
          }

          probe WG socks 56000 11080 19000
          probe RAW rawsocks 56003 11081 19001
          exit "$FAILED"
