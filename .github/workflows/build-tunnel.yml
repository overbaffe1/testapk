name: build-tunnel

# Собирает нативный туннель WDTT под разные платформы.
# Артефакты можно забрать из Actions → Artifacts и не собирать локально.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/f2fe24f5-testapk"
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: tunnel/src/go.mod

      - name: Resolve modules
        working-directory: tunnel/src
        run: go mod tidy

      - name: Build
        working-directory: tunnel/src
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "../bin/wdtt-tunnel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-tunnel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tunnel/bin/wdtt-tunnel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error
