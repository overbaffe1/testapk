name: build-tunnel

# Собирает нативный туннель WDTT под разные платформы.
# Артефакты можно забрать из Actions → Artifacts и не собирать локально.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/f2fe24f5-testapk"
    tags:
      - "v*"
    paths-ignore:
      - "dist/qwdtt-windows-x64.zip"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, ext: "" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, ext: "" }
          - { os: macos-latest, goos: darwin, goarch: amd64, ext: "" }
          - { os: macos-latest, goos: darwin, goarch: arm64, ext: "" }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: ".exe" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: tunnel/src/go.mod

      - name: Resolve modules
        working-directory: tunnel/src
        run: go mod tidy

      - name: Build tunnel
        working-directory: tunnel/src
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "../bin/wdtt-tunnel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Test native messaging host
        if: matrix.goarch == 'amd64' && (matrix.goos == 'linux' || matrix.goos == 'windows')
        working-directory: native-go
        run: go test ./...

      - name: Build native messaging host
        working-directory: native-go
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "../tunnel/bin/wdtt-native-host-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Build no-admin Windows installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-go/assets | Out-Null
          Copy-Item tunnel/bin/wdtt-tunnel-windows-amd64.exe installer-go/assets/wdtt-tunnel.exe
          Copy-Item tunnel/bin/wdtt-native-host-windows-amd64.exe installer-go/assets/wdtt-native-host.exe
          Push-Location installer-go
          try {
            go mod tidy
            go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../tunnel/bin/qwdtt-setup.exe .
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: qwdtt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tunnel/bin/wdtt-tunnel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            tunnel/bin/wdtt-native-host-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

      - name: Pack ready-to-install Windows bundle
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $bundle = 'package/qwdtt-windows-x64'
          New-Item -ItemType Directory -Force "$bundle/bin", "$bundle/native" | Out-Null
          # Файлы расширения кладём прямо в корень пакета: пользователь выбирает
          # распакованную папку целиком, и Chrome сразу видит manifest.json.
          Copy-Item -Recurse extension/* "$bundle/"
          Copy-Item native/install.cmd, native/install.ps1 "$bundle/native/"
          Copy-Item tunnel/bin/wdtt-tunnel-windows-amd64.exe "$bundle/bin/wdtt-tunnel.exe"
          Copy-Item tunnel/bin/wdtt-native-host-windows-amd64.exe "$bundle/bin/wdtt-native-host.exe"
          Copy-Item tunnel/bin/qwdtt-setup.exe "$bundle/qwdtt-setup.exe"
          Copy-Item WINDOWS.md "$bundle/README.txt"
          New-Item -ItemType Directory -Force dist | Out-Null
          if (Test-Path dist/qwdtt-windows-x64.zip) { Remove-Item dist/qwdtt-windows-x64.zip }
          Compress-Archive -Path "$bundle/*" -DestinationPath dist/qwdtt-windows-x64.zip -CompressionLevel Optimal

      - name: Publish Windows bundle to this branch
        if: matrix.goos == 'windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/qwdtt-windows-x64.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: ready Windows bundle [skip ci]"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
