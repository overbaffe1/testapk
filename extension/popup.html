<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>qWDTT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">q</span>
        <div>
          <strong>qWDTT</strong>
          <small>туннель для Chrome</small>
        </div>
      </div>
      <div id="status" class="status off"><i></i><span>Отключено</span></div>
    </header>

    <main>
      <label class="caption" for="subscription">Ссылка на подписку</label>
      <input id="subscription" class="subscription" type="url" spellcheck="false"
             placeholder="https://server/subnow/…" />

      <div class="caption mode-title">Режим</div>
      <div class="modes" role="radiogroup" aria-label="Режим подключения">
        <label><input type="radio" name="mode" value="raw" /><span>RAW</span></label>
        <label><input type="radio" name="mode" value="wg" /><span>WG</span></label>
        <label><input type="radio" name="mode" value="socks5" checked /><span>SOCKS5</span></label>
      </div>

      <details id="splitBox" class="split-box">
        <summary>Сплит-туннель <span>сайты напрямую</span></summary>
        <label class="caption" for="directPatterns">Без VPN</label>
        <textarea id="directPatterns" rows="3" spellcheck="false"
                  placeholder="arena.ai/*"></textarea>
        <small>По одному шаблону на строку. <b>*</b> — любое продолжение. Всё остальное идёт через VPN.</small>
        <button id="applySplit" class="split-save" type="button">Применить</button>
      </details>

      <button id="connect" class="connect" type="button">Подключить</button>

      <section class="info">
        <div><span>Сервер</span><b id="server">—</b></div>
        <div><span>Режим</span><b id="activeMode">SOCKS5</b></div>
        <div><span>Туннель</span><b id="tunnel">не запущен</b></div>
        <div><span>Внешний IP</span><b id="ip">—</b></div>
      </section>

      <button id="checkIp" class="secondary" type="button">Проверить IP</button>
      <p id="message" class="message"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
